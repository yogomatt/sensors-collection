version: 1
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  file:
    class : logging.handlers.RotatingFileHandler
    formatter: simple
    filename: logs/log_app.log
    maxBytes: 5242880
    backupCount: 5
#loggers:
#  simpleExample:
#    level: DEBUG
#    handlers: [console]
#    propagate: no
root:
  level: DEBUG
  handlers: [console,file]