version: 1
formatters:
  simple:
    format: '%(asctime)s - %(module)s - %(levelname)s: %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.handlers.RotatingFileHandler
    formatter: simple
    filename: /tmp/sensor_collection/log_app.log
    maxBytes: 5242880
    backupCount: 5
loggers:
  sensor:
    level: DEBUG
    handlers: [console,file]
    propagate: no
